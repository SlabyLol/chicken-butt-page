<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken Butt Clicker</title>
<style>
  body {
    background: #fff8dc;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    text-align: center;
    padding: 30px;
  }

  h1 {
    color: #ff4500;
  }

  #money {
    font-size: 24px;
    margin: 20px 0;
  }

  .chicken-butt {
    width: 150px;
    margin: 20px;
    cursor: pointer;
    transition: transform 0.2s;
    position: relative;
  }

  .chicken-butt:hover {
    transform: scale(1.2) rotate(10deg);
  }

  .kaka {
    font-size: 50px;
    position: absolute;
    animation: drop 1s linear forwards;
  }

  @keyframes drop {
    0% { transform: translateY(0px); opacity: 1; }
    100% { transform: translateY(200px); opacity: 0; }
  }
</style>
</head>
<body>
  <h1>🐔 Chicken Butt Clicker 🐔</h1>
  <p>Klicke auf den Hühnerhintern und verdiene Geld! Aber Vorsicht… es könnte 💩 machen 😆</p>
  <div id="money">💰 Geld: 0</div>

  <img src="cb-page-c.png" class="chicken-butt" id="butt" alt="Chicken Butt">

  <script>
    let money = 0;
    const butt = document.getElementById('butt');
    const moneyDisplay = document.getElementById('money');

    butt.addEventListener('click', () => {
      // 50% Chance für Kaka
      const isKaka = Math.random() < 0.5;

      if (isKaka) {
        // Kaka-Emoji erstellen
        const kaka = document.createElement('div');
        kaka.className = 'kaka';
        kaka.textContent = '💩';
        
        // zufällige horizontale Position innerhalb des Bildes
        const offsetX = Math.random() * butt.width - 25;
        kaka.style.left = `${butt.offsetLeft + offsetX}px`;
        kaka.style.top = `${butt.offsetTop + butt.height}px`;

        document.body.appendChild(kaka);
        setTimeout(() => kaka.remove(), 1000);
      }

      // Geld hinzufügen
      const earned = isKaka ? 50 : 10; // Viel Geld bei Kaka
      money += earned;
      moneyDisplay.textContent = `💰 Geld: ${money}`;
    });
  </script>
</body>
</html>
