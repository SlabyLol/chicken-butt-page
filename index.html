<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken Butt Clicker Ultra</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #fff8dc;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    text-align: center;
    overflow: hidden;
  }

  h1, #money {
    margin: 10px;
  }

  #money {
    font-size: 24px;
  }

  #butt-container {
    position: relative;
    display: inline-block;
  }

  #butt {
    width: 300px; /* kleineres Huhn */
    cursor: pointer;
    display: block;
  }

  .kaka {
    position: absolute;
    cursor: pointer;
    user-select: none;
    transition: transform 0.2s, opacity 0.3s;
  }

  .explosion {
    position: absolute;
    font-size: 20px;
    opacity: 1;
    pointer-events: none;
    animation: explode 0.5s ease-out forwards;
  }

  @keyframes explode {
    0% { transform: scale(1) translate(0,0); opacity: 1; }
    100% { transform: scale(var(--explosion-scale)) translate(var(--explosion-x), var(--explosion-y)); opacity: 0; }
  }

  .chick {
    position: absolute;
    width: 40px;
    animation: waddle 1s infinite alternate;
  }

  @keyframes waddle {
    0% { transform: translateX(0) rotate(-10deg); }
    50% { transform: translateX(5px) rotate(10deg); }
    100% { transform: translateX(0) rotate(-10deg); }
  }

  #shopButton {
    margin: 15px;
    padding: 8px 15px;
    border: 2px solid #ff4500;
    border-radius: 8px;
    cursor: pointer;
    display: inline-block;
    background-color: #ffe4b5;
  }
</style>
</head>
<body>
<h1>🐔 Chicken Butt Clicker Ultra 🐔</h1>
<div id="money">💰 Geld: 0</div>

<div id="butt-container">
  <img src="cb-page-c.png" id="butt" alt="Chicken Butt">
</div>

<button id="shopButton">Shop Laden: Bob</button>

<audio id="explodeSound" src="https://freesound.org/data/previews/170/170163_2437358-lq.mp3"></audio>

<script>
let money = 0;
let chicks = 0;

const moneyDisplay = document.getElementById('money');
const butt = document.getElementById('butt');
const buttContainer = document.getElementById('butt-container');
const shopButton = document.getElementById('shopButton');
const explodeSound = document.getElementById('explodeSound');

function updateMoneyDisplay() {
  moneyDisplay.textContent = `💰 Geld: ${Math.floor(money)}`;
}

function spawnKaka() {
  const kaka = document.createElement('div');
  const size = Math.random() * 50 + 20; // 20–70px
  kaka.style.fontSize = `${size}px`;
  kaka.className = 'kaka';
  kaka.textContent = '💩';

  const rect = butt.getBoundingClientRect();
  const x = Math.random() * (rect.width - size);
  const y = Math.random() * (rect.height - size);
  kaka.style.left = `${x}px`;
  kaka.style.top = `${y}px`;

  buttContainer.appendChild(kaka);

  kaka.addEventListener('click', () => {
    const earned = Math.floor(size); // Größe = Geld
    money += earned;
    updateMoneyDisplay();

    // Explosion
    const explosion = document.createElement('div');
    explosion.className = 'explosion';
    explosion.textContent = '💥';
    explosion.style.left = kaka.style.left;
    explosion.style.top = kaka.style.top;
    explosion.style.setProperty('--explosion-scale', 1.07); // 7% größer
    explosion.style.setProperty('--explosion-x', `${Math.random()*50-25}px`);
    explosion.style.setProperty('--explosion-y', `${Math.random()*-50}px`);
    buttContainer.appendChild(explosion);

    explodeSound.currentTime = 0;
    explodeSound.play();

    setTimeout(() => explosion.remove(), 500);
    kaka.remove();
  });

  setTimeout(() => kaka.remove(), 5000);
}

butt.addEventListener('click', () => {
  if (Math.random() < 0.5) spawnKaka();
  money += 10;
  updateMoneyDisplay();
});

// Shop Button (einfach alert für Demo)
shopButton.addEventListener('click', () => {
  alert("Willkommen bei Shop Laden Bob! Hier kannst du Küken und Upgrades kaufen.");
});

// Küken
setInterval(() => {
  if (chicks > 0) {
    money += chicks * 10;
    updateMoneyDisplay();
    if (Math.random() < 0.1) spawnKaka();
  }
}, 1000);

</script>
</body>
</html>
