<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken Butt Clicker Ultra</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #fff8dc;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    text-align: center;
    overflow: hidden;
  }

  h1, #money {
    margin: 10px;
  }

  #money {
    font-size: 24px;
  }

  #butt-container {
    position: relative;
    display: inline-block;
  }

  #butt {
    width: 600px;
    cursor: pointer;
    display: block;
  }

  .kaka {
    position: absolute;
    cursor: pointer;
    user-select: none;
    transition: transform 0.2s, opacity 0.3s;
  }

  .explosion {
    position: absolute;
    font-size: 20px;
    animation: explode 0.5s ease-out forwards;
  }

  @keyframes explode {
    0% { transform: scale(1) translate(0,0); opacity: 1; }
    100% { transform: scale(2) translate(50px,-50px); opacity: 0; }
  }

  #shop {
    margin-top: 20px;
  }

  .shop-item {
    margin: 10px;
    padding: 5px 10px;
    border: 2px solid #ff4500;
    border-radius: 8px;
    cursor: pointer;
    display: inline-block;
  }
</style>
</head>
<body>
<h1>🐔 Chicken Butt Clicker Ultra 🐔</h1>
<div id="money">💰 Geld: 0</div>

<div id="butt-container">
  <img src="cb-page-c.png" id="butt" alt="Chicken Butt">
</div>

<div id="shop">
  <div class="shop-item" id="buy-chick">🐣 Küken kaufen (10💰/s)</div>
</div>

<script>
let money = 0;
let chicks = 0;
const moneyDisplay = document.getElementById('money');
const butt = document.getElementById('butt');
const buttContainer = document.getElementById('butt-container');
const buyChickBtn = document.getElementById('buy-chick');

function updateMoneyDisplay() {
  moneyDisplay.textContent = `💰 Geld: ${Math.floor(money)}`;
}

// Funktion zum Spawn von Kaka
function spawnKaka() {
  const kaka = document.createElement('div');
  const size = Math.random() * 50 + 20; // Größe 20px–70px
  kaka.style.fontSize = `${size}px`;
  kaka.className = 'kaka';
  kaka.textContent = '💩';

  const rect = butt.getBoundingClientRect();
  const x = Math.random() * (rect.width - size);
  const y = Math.random() * (rect.height - size);
  kaka.style.left = `${x}px`;
  kaka.style.top = `${y}px`;

  buttContainer.appendChild(kaka);

  // Klick auf Kaka: explodiert
  kaka.addEventListener('click', () => {
    const earned = Math.floor(size); // Größe = Geld
    money += earned;
    updateMoneyDisplay();

    // Explosion-Animation
    const explosion = document.createElement('div');
    explosion.className = 'explosion';
    explosion.style.left = kaka.style.left;
    explosion.style.top = kaka.style.top;
    explosion.textContent = '💥';
    buttContainer.appendChild(explosion);

    setTimeout(() => explosion.remove(), 500);
    kaka.remove();
  });

  // Automatisches Entfernen nach 5 Sekunden, falls nicht geklickt
  setTimeout(() => kaka.remove(), 5000);
}

// Klick auf den Hühnerhintern
butt.addEventListener('click', () => {
  if (Math.random() < 0.5) spawnKaka(); // 50% Chance für Kaka
  money += 10;
  updateMoneyDisplay();
});

// Shop: Küken kaufen
buyChickBtn.addEventListener('click', () => {
  if (money >= 100) {
    money -= 100;
    chicks += 1;
    updateMoneyDisplay();
  }
});

// Küken erzeugen automatisch Geld und Kaka
setInterval(() => {
  if (chicks > 0) {
    money += chicks * 10; // pro Küken 10 pro Sekunde
    updateMoneyDisplay();

    chicks && Math.random() < 0.1 && spawnKaka(); // 10% Chance Kaka von Küken
  }
}, 1000);

</script>
</body>
</html>
